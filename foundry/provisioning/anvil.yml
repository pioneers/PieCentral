---
- name: provision development environment
  hosts: all
  roles:
    - base
  tasks:
    - name: set kernel release
      command: uname -r
      register: kernel_release
      changed_when: no
    - name: upgrade linux headers
      become: yes
      apt:
        name:
          - "linux-headers-{{ kernel_release.stdout }}"
    - name: set hostname
      become: yes
      hostname:
        name: anvil.local
    - name: generate SSH key
      command: "ssh-keygen -t rsa -b 4096 -C '{{ user.email }}' -N '' -f {{ ansible_env.HOME }}/.ssh/id_rsa"
      ignore_errors: yes
      args:
        creates:
          - "{{ ansible_env.HOME }}/.ssh/id_rsa"
          - "{{ ansible_env.HOME }}/.ssh/id_rsa.pub"
