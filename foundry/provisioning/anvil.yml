---
- name: provision development environment
  hosts: all
  roles:
    - base
  tasks:
    - name: set hostname
      become: yes
      become_user: root
      hostname:
        name: anvil.local
    - name: generate SSH key
      openssh_keypair:
        comment: "{{ user.email }}"
        path: "{{ ansible_env.HOME }}/.ssh/id_rsa"
        type: rsa
        size: 4096
    - become: yes
      become_user: root
      block:
        - name: disable static motd
          copy:
            content: ''
            dest: /etc/motd
          tags:
            - suppress-default-motd
        - name: install motd
          template:
            src: 20-logo.j2
            dest: /etc/update-motd.d/20-logo
            mode: '0755'
            backup: yes
