---
- name: team-specific configuration
  import_tasks: team.yml
  tags:
    - never
    - team
- name: initialize user executables
  file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    recurse: yes
    mode: '0755'
- name: initialize updates
  file:
    path: "{{ ansible_env.HOME }}/updates"
    state: directory
    mode: '0755'
- name: initialize student code
  command: "git init --bare '{{ ansible_env.HOME }}/student-code'"
  args:
    creates: "{{ ansible_env.HOME }}/student-code/.git/HEAD"
- name: copy update script
  copy:
    src: run-update
    dest: "{{ ansible_env.HOME }}/.local/bin"
    mode: '0755'

