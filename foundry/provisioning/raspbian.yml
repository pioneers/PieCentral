---
- name: provision raspberry pi
  hosts: localhost
  roles:
    - base
    - raspbian
  tasks:
    - name: set hostname
      become: yes
      become_user: root
      hostname:
        name: team{{ team_num }}
    - name: change the raspberry pi hostname files
      become: yes
      become_method: sudo
      become_user: root
      replace: 
        path: /etc/hosts
        regexp: "raspberrypi"
        replace: "team{{ team_num }}"
    - name: install Avahi
      become: yes
      become_method: sudo
      become_user: root
      apt:
        name: avahi-daemon

  # TODO: Take team number as an argument
  #       Command line argument --extra-vars '{"team_num":"__"}'
  # TODO: Install and set up Avahi for mDNS
