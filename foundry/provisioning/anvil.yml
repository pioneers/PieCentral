---
- name: provision development environment
  hosts: all
  roles:
    - base
  tasks:
    - name: set hostname
      become: yes
      become_user: root
      hostname:
        name: anvil.local
    - name: generate SSH key
      openssh_keypair:
        comment: "{{ user.email }}"
        path: "{{ ansible_env.HOME }}/.ssh/id_rsa"
        type: rsa
        size: 4096
    - become: yes
      become_user: root
      block:
        - name: disable static motd
          copy:
            content: ''
            dest: /etc/motd
          tags:
            - suppress-default-motd
        - name: install motd
          template:
            src: 20-logo.j2
            dest: /etc/update-motd.d/20-logo
            mode: '0755'
            backup: yes
    - block:
        - name: add PieCentral remote
          command: cd "{{ repo.path }}" && git init && git remote add "{{ repo.remote.name }}" "{{ repo.remote.url }}"
        - name: pull from PieCentral
          command: cd "{{ repo.path }}" && git pull "{{ repo.remote.name }}" "{{ repo.main_branch }}"
      vars:
        repo:
          path: /vagrant/PieCentral
          remote:
            name: origin
            url: git@github.com:pioneers/PieCentral.git
          main_branch: master
      ignore_errors: yes
