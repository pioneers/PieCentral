---
- name: team-specific configuration
  import_tasks: team.yml
  tags:
    - never
    - team
- name: initialize user executables
  file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    recurse: yes
    mode: '0755'
- name: initialize updates
  file:
    path: "{{ ansible_env.HOME }}/updates"
    state: directory
    mode: '0755'
- name: initialize student code
  command: "git init '{{ ansible_env.HOME }}/student-code'"
  args:
    creates: "{{ ansible_env.HOME }}/student-code/.git/HEAD"
- name: copy update script
  copy:
    src: run-update
    dest: "{{ ansible_env.HOME }}/.local/bin"
    mode: '0755'
- name: install python packages
  pip:
    name:
      - ansible
      - virtualenv
    extra_args: --user --trusted-host pypi.org --trusted-host files.pythonhosted.org
- name: copy update service
  become: yes
  copy:
    src: update.service
    dest: /etc/systemd/system
- name: copy runtime service
  become: yes
  copy:
    src: runtime.service
    dest: /etc/systemd/system
- name: enable update service
  become: yes
  systemd:
    daemon_reload: yes
    enabled: yes
    name: update
    scope: system
- name: enable runtime service
  become: yes
  systemd:
    daemon_reload: yes
    enabled: yes
    name: runtime
    scope: system
- name: disable docker service
  become: yes
  systemd:
    daemon_reload: yes
    enabled: no
    name: docker
    scope: system
    state: stopped
