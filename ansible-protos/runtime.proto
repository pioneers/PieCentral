syntax = "proto3";
message RuntimeData {
    enum State {
        STUDENT_CRASHED = 0;
        STUDENT_RUNNING = 1;
        STUDENT_STOPPED = 2;
        TELEOP = 3;
        AUTO = 4;
        ESTOP = 5;
    }
    message ParamValue {
        string param = 1;
        float value = 2;
    }
    message SensorData {
        reserved "value";
        reserved 3;
        string device_type = 1;
        string device_name = 2;
        uint64 uid = 4;
        uint32 int_device_type = 5;
        repeated ParamValue param_value = 6;
    }
    State robot_state = 1;
    repeated SensorData sensor_data = 2;
}
