---
# Usage: `ansible-playbook raspbian.yml --extra-vars "team_num=XX password=XXXXXXXX"`
# Usage: Reboot at the end.
# TODO: Better use of templating (e.g. Jinja templates)
- name: provision raspberry pi
  hosts: localhost
  roles:
    - base
    - raspbian
  tasks:
    - name: team number in wpa_supplicant
      become: yes
      become_user: root
      replace:
        path: /etc/wpa_supplicant/wpa_supplicant.conf
        regexp: 'ssid="Team[0-9]{2}"'
        replace: 'ssid="Team{{ team_num }}"'
    - name: password in wpa_supplicant
      become: yes
      become_user: root
      replace:
        path: /etc/wpa_supplicant/wpa_supplicant.conf
        regexp: 'psk="[0-9]{0,8}"'
        replace: 'psk="{{ password }}"'
    - name: team num in interfaces
      become: yes
      become_user: root
      replace:
        path: /etc/networking/interfaces
        regexp: 'address 192.168.(128|0).2([0-9]{2})'
        replace: 'address 192.168.\1.2{{ team_num }}'
    - name: team num in dhcpcd
      become: yes
      become_user: root
      replace:
        path: /etc/dhcpcd.conf
        regexp: 'address 192.168.128.2([0-9]{2})'
        replace: 'address 192.168.128.2{{ team_num }}'
    - name: install Avahi
      become: yes
      become_method: sudo
      become_user: root
      apt:
        name: avahi-daemon
    - name: set hostname
      become: yes
      become_user: root
      hostname:
        name: "team{{ team_num }}"
    - name: change the raspberry pi hostname files
      become: yes
      become_method: sudo
      become_user: root
      replace: 
        path: /etc/hosts
        regexp: "(raspberrypi|team[0-9]{2})"
        replace: "team{{ team_num }}"
