syntax = "proto3";

import public "robotstate.proto";

message RuntimeData {

    message ParamValue {
        string param = 1;
        oneof kind {
            float float_value = 2;
            int32 int_value = 3;
        }
    }
    message SensorData {
        reserved "value";
        reserved 3;
        string device_type = 1;
        string device_name = 2;
        uint64 uid = 4;
        uint32 int_device_type = 5;
        repeated ParamValue param_value = 6;
    }
    RobotState robot_state = 1;
    repeated SensorData sensor_data = 2;
}
