---
- name: provision raspberry pi
  hosts: all
  roles:
    - base
  vars:
    - team_num: 00
  tasks:
    - name: set hostname
      become: yes
      become_user: root
      hostname:
        name: team{{ team_num }}
  # TODO: Take team number as an argument
  # TODO: Install and set up Avahi for mDNS