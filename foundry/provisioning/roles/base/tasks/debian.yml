---
- name: install apt packages
  become: yes
  become_user: root
  block:
    - name: upgrade existing packages
      apt:
        upgrade: dist
    - name: install development packages
      apt:
        name: "{{ item }}"
        state: latest
      with_items:
        - vim
        - zsh
        - git
        - gcc
        - make
        - wget
        - htop
        - curl
        - zip
        - unzip
        - hub
        - build-essential
        # - linux-headers-generic
    - name: install docker
      block:
        - apt:
            name: "{{ item }}"
            state: latest
          with_items:
            - apt-transport-https
            - ca-certificates
            - gnupg2
            - software-properties-common
        - apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
        - apt_repository:
            repo: deb [arch=amd64] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable
        - apt:
            name: "{{ item }}"
            state: latest
          with_items:
            - docker-ce
            - docker-ce-cli
            - containerd.io
      tags:
        - docker
    - name: clean packages
      apt:
        autoclean: yes
        autoremove: yes
